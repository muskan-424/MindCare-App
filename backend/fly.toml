# Fly.io — long-lived MindCare API with WebSocket Tink chat.
# Deploy from backend/: fly launch (once) → fly secrets set → fly deploy
# Docs: https://fly.io/docs/reference/configuration/

app = 'mindcare-api'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '5000'

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    method = 'GET'
    path = '/api/health'
    timeout = '5s'
