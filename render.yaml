# Render Blueprint — MindCare API (long-lived WebSocket + background jobs)
# Import in Render Dashboard → Blueprints, then set secret env vars in the UI.
# Do NOT commit real secrets here.

services:
  - type: web
    name: mindcare-api
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      # ── Set these in the Render Dashboard (Environment tab) ──
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ADMIN_EMAIL_1
        sync: false
      # Redis is optional — leave blank to skip Redis on Render
      - key: REDIS_URL
        sync: false
