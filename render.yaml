# Render Blueprint — MindCare API (long-lived WebSocket + background jobs)
# Dashboard → New Blueprint → connect repo, OR create Web Service manually:
#   Root Directory: backend
#   Build: npm ci --legacy-peer-deps --omit=dev
#   Start: npm start
#   Health check path: /api/health
#
# REQUIRED secrets (Environment tab — same values as Vercel):
#   MONGODB_URI, JWT_SECRET, ADMIN_TOKEN
# Optional: GOOGLE_API_KEY, REDIS_URL, PINECONE_*, TAVILY_API_KEY

services:
  - type: web
    name: mindcare-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --legacy-peer-deps --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Do NOT set PORT — Render injects it automatically.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ADMIN_EMAIL_1
        sync: false
      - key: REDIS_URL
        sync: false
